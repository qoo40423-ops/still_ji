<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紀家烘焙坊 - 蛋黃酥預購系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto space-y-8">
        
        <!-- 頁首標題與公告 -->
        <div class="text-center space-y-3">
            <h1 class="text-3xl font-bold text-amber-700">🥮 紀家烘焙坊 - 蛋黃酥預購系統</h1>
            
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-left text-xs text-amber-900 space-y-1.5 shadow-xs">
                <p class="font-bold text-amber-800 text-sm">✨ 產品特色與食用保存須知：</p>
                <p>• <strong>成份說明：</strong>本產品使用<strong>植物油</strong>製作，<strong>蛋奶素可食用</strong>（不含豬油成份）。</p>
                <p>• <strong>保存期限：</strong>常溫保存一個禮拜，產品上有註明其有效期限。</p>
                <p>• <strong>提袋說明：</strong>6入宅配預設附贈塑膠背心袋，若有送禮需求可加購精美不織布提袋（$20/個）。</p>
            </div>
        </div>

        <!-- 模式切換按鈕 -->
        <div class="flex rounded-xl bg-gray-200 p-1 shadow-inner">
            <button type="button" id="tabPickup" onclick="switchMode('pickup')" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition duration-200 bg-amber-600 text-white shadow-sm cursor-pointer">
                🛍️ 現場自取預訂
            </button>
            <button type="button" id="tabDelivery" onclick="switchMode('delivery')" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition duration-200 text-gray-600 hover:text-gray-900 cursor-pointer">
                📦 宅配到府預購
            </button>
        </div>

        <!-- 填寫訂單區 -->
        <div id="formBlock" class="bg-white shadow-sm rounded-xl p-6 border border-gray-100">
            <h2 id="formTitle" class="text-xl font-bold text-gray-700 mb-4 pb-2 border-b border-gray-100">✨ 填寫現場自取預訂單</h2>
            
            <form id="orderForm" class="space-y-5">
                <input type="hidden" id="orderMode" value="pickup">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label id="nameLabel" class="block text-sm font-medium text-gray-600 mb-1">取貨人姓名 *</label>
                        <input type="text" id="buyerName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label id="phoneLabel" class="block text-sm font-medium text-gray-600 mb-1">取貨人手機 *</label>
                        <input type="tel" id="buyerPhone" required placeholder="如：0912345678" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <!-- 宅配專用欄位區 -->
                <div id="deliveryFields" class="hidden space-y-4 pt-2 border-t border-gray-100">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">收件人地址 *</label>
                        <input type="text" id="receiverAddress" placeholder="請填寫完整配送地址" oninput="calculateCart()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">電子發票開立選項 *</label>
                            <select id="invoiceType" onchange="toggleTaxFields()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                                <option value="個人電子發票">個人電子發票</option>
                                <option value="公司用電子發票(統編)">公司用電子發票 (需打統編)</option>
                            </select>
                        </div>
                        <div id="taxFields" class="hidden pt-1">
                            <label class="block text-sm font-medium text-gray-600 mb-1">統一編號 *</label>
                            <input type="text" id="taxId" placeholder="請輸入8碼統編" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                        </div>
                    </div>
                </div>

                <!-- 日期與時段選擇區 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label id="dateLabel" class="block text-sm font-medium text-gray-600 mb-1">取貨日期 *</label>
                        <input type="date" id="orderDate" required onchange="validateDate()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring
